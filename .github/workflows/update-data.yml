name: Actualizar datos Bolsa de Santiago

on:
  schedule:
    # 21:00 UTC ≈ 17:00 hora de Chile (CLT, UTC-4).
    # Chile usa horario de verano (CLST, UTC-3) parte del año: si notas que
    # la tarea corre una hora antes/después de lo esperado en esas fechas,
    # ajusta este valor a "0 20 * * 1-5".
    - cron: "0 21 * * 1-5" # lunes a viernes (el mercado no opera fines de semana)
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance

      - name: Descargar y guardar datos del día
        run: python scripts/fetch_data.py

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización de datos automática"
          file_pattern: "data/history.json data/crypto_history.json"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
